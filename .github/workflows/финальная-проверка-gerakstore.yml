name: Финальная проверка GeraKStore

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Обновить внутренние идентификаторы
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          skip = {'.git', '.github'}
          extensions = {'.py','.json','.md','.txt','.yml','.yaml','.sh','.html','.js','.css','.h','.m','.mm','.swift','.xml','.plist','.strings','.pbxproj','.entitlements'}
          for p in root.rglob('*'):
              if not p.is_file() or any(x in skip for x in p.parts) or p.suffix.lower() not in extensions:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              old = s
              s = s.replace('GERASTORE_DIR', 'GERAKSTORE_DIR')
              s = s.replace('GERASTORE_REPO', 'GERAKSTORE_REPO')
              if s != old:
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Удалить одноразовый workflow и сохранить изменения
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/финальная-проверка-gerakstore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Завершить обновление кода GeraKStore"
          git push
